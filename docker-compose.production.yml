services:
  dashboard:
    environment:
      BASE_PATH: /elink-dashboard
    networks:
      shared-redis:
      viaiz-ingress:
        aliases:
          - elink-dashboard
      usage:

  usage-agent:
    image: viaiz-eink-dashboard:latest
    restart: unless-stopped
    user: "${USAGE_AGENT_UID:-1000}:${USAGE_AGENT_GID:-1000}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export VIAIZ_INGEST_TOKEN="$${INGEST_TOKENS%%,*}";
        exec /app/usage-agent push
        --server http://dashboard:8080/elink-dashboard
        --codex-home /codex --no-claude --interval 1m
    environment:
      INGEST_TOKENS: ${INGEST_TOKENS:?Set INGEST_TOKENS in .env}
    volumes:
      - ${CODEX_SESSIONS_DIR:-/home/futu/.codex/sessions}:/codex/sessions:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -r /codex/sessions && test -x /codex/sessions &&
          curl -fsS --max-time 5 http://dashboard:8080/elink-dashboard/healthz >/dev/null
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - usage
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  usage:
    internal: true
  viaiz-ingress:
    external: true
    name: localterm-website_default
